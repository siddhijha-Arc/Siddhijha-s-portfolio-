<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Afdal Trotoart ID Card Badge</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Michroma&amp;family=Playfair+Display:ital,wght@0,700;0,900;1,700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Syne:wght@700;800&amp;family=Chakra+Petch:wght@700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="typography">
  .font-michroma {
    font-family: 'Michroma', sans-serif;
  }
  .font-space {
    font-family: 'Space Grotesk', monospace, sans-serif;
  }
  .font-serif-display {
    font-family: 'Cinzel', 'Playfair Display', serif;
  }

  /* Extended typography matching reference image without collision */
  .font-techno-capsule {
    font-family: 'Michroma', sans-serif;
    letter-spacing: -0.02em;
    display: inline-block;
  }

  .font-wide-trotoart {
    font-family: 'Michroma', sans-serif;
    letter-spacing: -0.01em;
    transform: scaleY(0.92);
  }
</style>
<style data-purpose="textures-and-effects">
  /* Dark textured backdrop */
  .bg-dark-textured {
    background-color: #0b0b0b;
    background-image: 
      radial-gradient(circle at 50% 25%, #181818 0%, #080808 90%);
  }

  /* Realistic laminated ID card shadow */
  .badge-card-shadow {
    box-shadow: 
      0 30px 60px -15px rgba(0, 0, 0, 0.95),
      0 0 0 1px rgba(255, 255, 255, 0.12),
      0 12px 24px -6px rgba(0, 0, 0, 0.7);
  }

  /* Authentic high-fidelity crinkled cellophane plastic wrap with specular creases */
  .crease-overlay {
    background:
      radial-gradient(ellipse 65% 35% at 25% 65%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 60%),
      radial-gradient(ellipse 50% 45% at 80% 30%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 70%),
      linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.02) 42%, rgba(255, 255, 255, 0.14) 100%);
  }

  /* Perspective wireframe yellow corridor tunnel grid */
  .perspective-tunnel {
    background-color: #F5B800;
  }

  /* Masking tape strip realistic texture */
  .tape-strip-realistic {
    background: linear-gradient(135deg, #e6b124 0%, #f7c938 35%, #e1aa1b 65%, #f2bf2b 100%);
    box-shadow: 2px 3px 7px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.45);
    clip-path: polygon(
      0% 4%, 3% 0%, 97% 2%, 100% 6%, 98% 95%, 95% 100%, 3% 98%, 0% 93%
    );
  }
</style>
</head>
<body class="bg-dark-textured min-h-screen flex flex-col items-center justify-start py-0 px-3 overflow-x-hidden antialiased select-none">
<!-- BEGIN: Lanyard Hardware System -->
<header class="relative z-30 flex flex-col items-center w-full pointer-events-none" data-purpose="lanyard-hardware">
<!-- Woven Yellow Lanyard Ribbon -->
<div class="w-10 h-16 bg-[#F5B800] shadow-md border-x border-[#c98e09] flex flex-col justify-end items-center relative">
<div class="absolute inset-y-0 left-1 w-[1px] bg-amber-600/40"></div>
<div class="absolute inset-y-0 right-1 w-[1px] bg-amber-600/40"></div>
<!-- Metal Ribbon Clamp / Crimp -->
<div class="w-12 h-3.5 bg-gradient-to-r from-zinc-400 via-zinc-200 to-zinc-400 border border-zinc-500 rounded-sm shadow-sm flex items-center justify-center">
<div class="w-10 h-[1.5px] bg-zinc-600/60"></div>
</div>
</div>
<!-- Metal Swivel Trigger Snap Hook Clasp -->
<div class="relative flex flex-col items-center -mt-0.5">
<!-- Swivel Ring -->
<div class="w-5 h-3 border-2 border-zinc-400 rounded-sm bg-gradient-to-b from-zinc-300 to-zinc-500 shadow-inner"></div>
<!-- Golden / Metallic Spring Snap Hook penetrating the ID badge hole -->
<svg class="w-8 h-10 drop-shadow-md -mt-1" fill="none" stroke="currentColor" viewbox="0 0 36 44">
<defs>
<lineargradient id="goldMetal" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#fff4b8"></stop>
<stop offset="35%" stop-color="#f5b800"></stop>
<stop offset="70%" stop-color="#d49400"></stop>
<stop offset="100%" stop-color="#8a5c00"></stop>
</lineargradient>
</defs>
<path d="M14 2 H22 V10 H14 Z" fill="url(#goldMetal)" stroke="#785000" stroke-width="1"></path>
<path d="M18 10 C12.5 15 10.5 21 11.5 29 C12.5 35 15.5 39 18 42 C20.5 39 23.5 35 24.5 29 C25.5 21 23.5 15 18 10 Z" fill="url(#goldMetal)" stroke="#664300" stroke-width="1.2"></path>
<path d="M16 16 L20 26" stroke="#fff9d2" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</div>
</header>
<!-- END: Lanyard Hardware System -->
<!-- BEGIN: ID Card Body -->
<main class="relative -mt-4 w-full max-w-[380px] mb-12" data-purpose="id-badge-body">
<div class="relative bg-[#ffffff] rounded-[28px] border border-zinc-200/90 badge-card-shadow px-4 pt-3 pb-5 flex flex-col overflow-hidden">
<!-- Realistic Crinkled Cellophane / Plastic Wrap Crease Overlay matching IMAGE_4 -->
<div class="absolute inset-0 pointer-events-none z-30 crease-overlay mix-blend-screen opacity-85">
<svg class="w-full h-full absolute inset-0 opacity-60" fill="none" preserveaspectratio="none" stroke="rgba(255,255,255,0.85)" viewbox="0 0 320 600">
<!-- Prominent organic angular crinkle lines exactly matching IMAGE_4 -->
<path d="M25 15 L105 175 L190 220 L295 110" stroke-width="1.1"></path>
<path d="M105 175 L85 345 L170 415 L140 540" stroke-width="1"></path>
<path d="M190 220 L235 365 L295 440" stroke-width="1.2"></path>
<path d="M15 285 L80 315 L140 335" stroke-width="0.8"></path>
<path d="M285 215 L210 290 L240 395" stroke-width="0.9"></path>
<path d="M35 470 L120 435 L260 500" stroke-width="1"></path>
<path d="M135 95 L180 205 L150 285" stroke-width="0.7"></path>
<!-- Additional micro crinkle stress lines -->
<path d="M98 165 L120 185 L90 220" stroke-width="0.6"></path>
<path d="M195 210 L220 240 L185 270" stroke-width="0.65"></path>
<path d="M80 340 L115 365 L85 390" stroke-width="0.75"></path>
<path d="M230 355 L265 390 L220 415" stroke-width="0.7"></path>
<path d="M165 410 L195 435 L155 465" stroke-width="0.6"></path>
<path d="M50 80 L90 120 L40 160" stroke-width="0.5"></path>
<path d="M270 300 L305 330 L275 365" stroke-width="0.55"></path>
</svg>
</div>
<!-- BEGIN: Card Header -->
<section class="relative w-full flex items-center justify-between pt-1 pb-2 px-1" data-purpose="badge-header">
<!-- Left: Designer Identity & Role -->
<div class="flex flex-col text-left leading-tight z-10">
<span class="font-michroma text-[12px] font-bold text-black tracking-wider">AFDAL</span>
<span class="font-michroma text-[7.5px] font-semibold text-black tracking-wider mt-0.5">GRAPHIC DESIGNER</span>
</div>
<!-- Center: Cutout Slot for Lanyard Hook -->
<div class="absolute left-1/2 -translate-x-1/2 -top-1 flex flex-col items-center z-10">
<div class="w-12 h-3 bg-[#111111] rounded-full border-[1.5px] border-zinc-400 shadow-inner flex items-center justify-center">
<!-- Hook connection visible through slot -->
<div class="w-2.5 h-3 bg-gradient-to-b from-amber-400 to-amber-600 rounded-sm opacity-95"></div>
</div>
</div>
<!-- Right: Bold Futuristic Rounded Numerals 09.09 (Clean, perfectly contained, zero overlap) -->
<div class="flex items-center justify-end z-10">
<span class="font-techno-capsule font-extrabold text-[22px] leading-none text-black">09.09</span>
</div>
</section>
<!-- END: Card Header -->
<!-- BEGIN: Hero Portrait with Perspective Corridor Grid -->
<section class="relative w-full mt-1" data-purpose="hero-portrait-frame">
<div class="w-full relative border-[2.2px] border-black perspective-tunnel rounded-none overflow-hidden flex items-end justify-center aspect-[1/1.1]">
<!-- Receding 3D Perspective Tunnel Grid Lines -->
<div class="absolute inset-0 pointer-events-none">
<svg class="w-full h-full absolute inset-0" preserveaspectratio="none" viewbox="0 0 100 100">
<!-- Perspective depth frames -->
<rect fill="none" height="100" stroke="#d69b00" stroke-width="0.6" width="100" x="0" y="0"></rect>
<rect fill="none" height="76" stroke="#d69b00" stroke-width="0.5" width="76" x="12" y="12"></rect>
<rect fill="none" height="52" stroke="#d69b00" stroke-width="0.45" width="52" x="24" y="24"></rect>
<rect fill="none" height="28" stroke="#d69b00" stroke-width="0.4" width="28" x="36" y="36"></rect>
<rect fill="none" height="12" stroke="#d69b00" stroke-width="0.35" width="12" x="44" y="44"></rect>
<!-- Corner radiating perspective lines -->
<line stroke="#d69b00" stroke-width="0.5" x1="0" x2="50" y1="0" y2="50"></line>
<line stroke="#d69b00" stroke-width="0.5" x1="100" x2="50" y1="0" y2="50"></line>
<line stroke="#d69b00" stroke-width="0.5" x1="0" x2="50" y1="100" y2="50"></line>
<line stroke="#d69b00" stroke-width="0.5" x1="100" x2="50" y1="100" y2="50"></line>
<!-- Mid-wall perspective lines -->
<line stroke="#d69b00" stroke-dasharray="2 2" stroke-width="0.35" x1="50" x2="50" y1="0" y2="100"></line>
<line stroke="#d69b00" stroke-dasharray="2 2" stroke-width="0.35" x1="0" x2="100" y1="50" y2="50"></line>
</svg>
</div>
<!-- Cutout Portrait from IMAGE_8 contained within the yellow grid frame -->
<div class="relative w-full h-[98%] flex items-end justify-center z-10 overflow-hidden">
<img alt="Afdal Portrait" class="h-full w-auto max-w-full object-contain object-bottom select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBapep6T0XffwcuER9umBJrjPcRsTKby6dTNT2e0-vvM41EQQE-Nlk1GC5iuBqXqJj838FU8fcmdY_BfOyoJ58aI3QlxnwdM6B288X0RMGvR6Yx4CzLXVzJPqNM6Ip58P5ulMFADNc0wXIvjH-CNRhr4wrXy_UXQA2HnGcX_CtS-FQCu4KyX_OEnfxTWU9DzuEzOhyMEJUehDdLHZrcFLo8BvFWEoZtyHOcPjI33zygE2uPAsbFi3zNBrRANxZYdsGt"/>
</div>
</div>
</section>
<!-- END: Hero Portrait -->
<!-- BEGIN: Middle Typography Row (Clean spacing, zero collision) -->
<section class="w-full mt-3 mb-2 px-0.5 flex items-center justify-between gap-2" data-purpose="typography-title-row">
<!-- Left: MATURE TYPEFACE cleanly stacked -->
<div class="flex flex-col leading-[1.1] shrink-0">
<span class="font-michroma text-[9px] font-bold tracking-wider text-black">MATURE</span>
<span class="font-michroma text-[9px] font-bold tracking-wider text-black mt-0.5">TYPEFACE</span>
</div>
<!-- Right: TROTOART Brand Title (Properly scaled, no collision) -->
<div class="flex-1 text-right overflow-hidden">
<h2 class="font-wide-trotoart text-[21px] sm:text-[23px] font-bold text-black tracking-tight uppercase whitespace-nowrap inline-block">TROTOART</h2>
</div>
</section>
<!-- END: Middle Typography Row -->
<!-- BEGIN: Bottom Section Dual Cards (Exact Match to IMAGE_4 with black right card & clean spacing) -->
<section class="w-full grid grid-cols-2 gap-2.5 items-stretch relative mt-0.5 pb-1" data-purpose="info-modules">
<!-- LEFT MODULE: Dark Charcoal Box -->
<article class="bg-[#111111] rounded-[2px] p-2 flex flex-col justify-between relative shadow-sm text-white min-h-[96px]" data-purpose="bio-and-typography-box">
<!-- Top Row: Exact micro-sans text on left, crisp vertical barcode with numbers on right -->
<div class="flex justify-between items-start gap-1">
<div class="text-[6.5px] font-space font-medium leading-[1.3] text-zinc-300">
<p>Iam Afdal and i a graphic designer</p>
<p>And i the owner of Trotoart</p>
<p>Studio</p>
</div>
<!-- Clean Crisp Vertical White Barcode with numbers -->
<div class="flex flex-col items-center flex-shrink-0">
<svg class="h-8 w-4 text-white" fill="currentColor" viewbox="0 0 20 48">
<rect height="40" width="1.8" x="0" y="0"></rect>
<rect height="40" width="0.9" x="3" y="0"></rect>
<rect height="40" width="2.4" x="5.5" y="0"></rect>
<rect height="40" width="1.2" x="9" y="0"></rect>
<rect height="40" width="0.8" x="11.5" y="0"></rect>
<rect height="40" width="2.6" x="13.5" y="0"></rect>
<rect height="40" width="1.5" x="17.2" y="0"></rect>
<!-- Barcode digits at bottom -->
<text fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="4.5" letter-spacing="0.5" text-anchor="middle" x="10" y="47">89024</text>
</svg>
</div>
</div>
<!-- Bottom Typography: TYPEFACE in Yellow, DESIGNER underneath in Crisp White -->
<div class="mt-3 leading-none">
<p class="font-michroma text-[10.5px] font-extrabold tracking-tight text-[#ffcc00]">TYPEFACE</p>
<p class="font-michroma text-[11px] font-black tracking-tight text-white mt-1">DESIGNER</p>
</div>
</article>
<!-- RIGHT MODULE: Solid Black Background with white/gold text matching IMAGE_4 -->
<article class="bg-white rounded-[2px] p-2 flex flex-col justify-between shadow-sm min-h-[96px] text-black border border-zinc-200/80" data-purpose="ranking-and-credits-box"><div><div class="w-full flex items-center justify-center pt-0.5"><span class="font-serif-display text-[10px] font-bold tracking-[0.35em] text-black pl-[0.35em]">DAL</span></div><div class="w-full h-[1px] bg-zinc-300 mt-1 mb-1.5"></div><div class="text-center py-0.5"><h3 class="font-serif-display text-[19px] font-black text-black tracking-wider leading-none">TOP 1</h3><div class="w-12 h-[1.5px] bg-black mx-auto mt-1"></div></div></div><div><div class="w-full h-[1px] bg-zinc-300 mb-1 mt-1"></div><div class="text-[5px] text-zinc-600 font-space text-center leading-[1.35] font-normal"><p>You can view my envato on creative fabrica</p><p class="mt-0.5">or just visit my instagram on <span class="font-semibold underline text-black">@trotoart</span></p><p class="text-[4.6px] text-zinc-500 mt-0.5">to see my all work profile</p></div></div></article>
<!-- Decorative Yellow Masking Tape "X" Cross placed overlapping between the bottom two cards -->
<div class="absolute -bottom-2.5 left-1/2 -translate-x-1/2 z-40 pointer-events-none" data-purpose="decorative-tape-cross">
<div class="relative w-10 h-10 flex items-center justify-center">
<!-- Strip 1 (-45 deg) -->
<div class="absolute w-10 h-3.5 tape-strip-realistic -rotate-45 transform"></div>
<!-- Strip 2 (+45 deg) -->
<div class="absolute w-10 h-3.5 tape-strip-realistic rotate-45 transform"></div>
</div>
</div>
</section>
<!-- END: Bottom Section Dual Cards -->
</div>
</main>
<!-- END: ID Card Body -->
</body></html>
